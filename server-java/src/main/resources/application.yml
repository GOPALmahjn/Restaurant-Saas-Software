server:
  port: ${PORT:5000}

spring:
  application:
    name: restaurant-ar-api

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/restaurant_ar}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  data:
    redis:
      # Redis Cloud: set REDIS_URL to rediss://default:<password>@<host>:<port>
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

# Application-specific configuration
app:
  cors:
    allowed-origins: ${CLIENT_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change_this_super_secret_jwt_key_at_least_32_bytes_long}
    refresh-secret: ${JWT_REFRESH_SECRET:change_this_super_secret_refresh_key_at_least_32_bytes}
    access-expiration-ms: ${JWT_EXPIRE_MS:900000}        # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRE_MS:604800000} # 7 days
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  client-url: ${CLIENT_URL:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@restaurant.com}
    password: ${ADMIN_PASSWORD:Admin@123456}
    name: ${ADMIN_NAME:Super Admin}

logging:
  level:
    org.hibernate.SQL: warn
